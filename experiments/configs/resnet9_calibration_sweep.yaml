# Calibration sweep config (experiments/calibration_sweep.py): supplies only the
# model/data/crossbar settings so the sweep rebuilds exactly the system a deployment starts
# from. No remap is run by the sweep; policy none. Pass --checkpoint (the seed-42
# pre_deploy.pt) on the command line.
name: resnet9_calibration_sweep
simulator: crosssim
regime: deployment
pre_deploy_checkpoint: results/resnet9_predeploy/pre_deploy.pt
# Model/data settings must match the predeploy config so the loaded weights and the
# canary/test splits mean the same thing.
epochs: 14
float_pretrain_epochs: 10
num_batches: 390
batch_size: 128
train_samples: 50000
test_samples: 5000
learning_rate: 0.05
optimizer: sgd
momentum: 0.9
label_smoothing: 0.1
grad_clip_norm: 1.0
weight_decay: 0.0001
eval_interval: 100
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
  redundancy_factor: 0.15
  use_gpu: true
  calibrate_adc: true
  adc_calibration_images: 320
  calibrate_dac: true
fault:
  density: 0.1
  distribution: random
  injection_interval: 5200
  wave_densities: [0.1, 0.1, 0.1]
mitigation:
  enable_soft_mitigation: false
  enable_remapping: true
  enable_layer_reset: false
  enable_predictive: false
retraining:
  policy: none
  canary_size: 1024
  burst_lr: 1.0e-3
