# Mixed-fault-regime re-run - see resnet9_fault_mixed_no_mitigation.yaml for the full
# rationale (ExperimentConfig.secondary_fault, config.py). This arm is the direct fix for
# resnet9_fault_soft_mitigation.yaml's documented PROVEN NO-OP: under stuck-at-only faults,
# enable_soft_mitigation never fires because dispatch.py only routes it through
# monitor.drift_mask, which pure density injection never sets. Here, secondary_fault
# actually generates real drift faults every wave (same severity, density=0.1, as
# resnet9_fault_soft_mitigation_drift.yaml's drift-only arm), so soft_mitigation finally
# gets real work in the same run remapping/layer_reset are being compared against.
name: resnet9_fault_mixed_soft_mitigation
simulator: crosssim
epochs: 50
float_pretrain_epochs: 10
finetune_learning_rate: 0.001
num_batches: 390
batch_size: 128
train_samples: 50000
test_samples: 5000
learning_rate: 0.05
optimizer: sgd
momentum: 0.9
lr_one_cycle: true
label_smoothing: 0.1
grad_clip_norm: 1.0
weight_decay: 0.0001
eval_interval: 100
save_checkpoint: true  # real, reported-number run
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
  use_gpu: true
  calibrate_adc: true
  adc_calibration_images: 320
  calibrate_dac: true
fault:
  density: 0.1
  distribution: random
  injection_interval: 5200
secondary_fault:
  failure_model: drift
  density: 0.1
  distribution: random
  injection_interval: 5200
mitigation:
  enable_soft_mitigation: true
  enable_remapping: false
  enable_layer_reset: false
  enable_predictive: false
