# Milestone-2 plan item 2 - see resnet9_fault_mixed_remapping_rowcol.yaml for the full
# rationale (row_col_granularity vs idealized_per_cell redundancy). Same swap applied to the
# "combined" arm (all three strategies enabled) so the row/col-realistic redundancy model is
# checked under the same condition resnet9_fault_mixed_combined.yaml already covers for the
# idealized scheme, not just in isolation.
name: resnet9_fault_mixed_combined_rowcol
simulator: crosssim
epochs: 50
float_pretrain_epochs: 10
finetune_learning_rate: 0.001
num_batches: 390
batch_size: 128
train_samples: 50000
test_samples: 5000
learning_rate: 0.05
optimizer: sgd
momentum: 0.9
lr_one_cycle: true
label_smoothing: 0.1
grad_clip_norm: 1.0
weight_decay: 0.0001
eval_interval: 100
save_checkpoint: true  # real, reported-number run
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: row_col_granularity
  use_gpu: true
  calibrate_adc: true
  adc_calibration_images: 320
  calibrate_dac: true
fault:
  density: 0.1
  distribution: random
  injection_interval: 5200
secondary_fault:
  failure_model: drift
  density: 0.1
  distribution: random
  injection_interval: 5200
mitigation:
  enable_soft_mitigation: true
  enable_remapping: true
  enable_layer_reset: true
  enable_predictive: false
