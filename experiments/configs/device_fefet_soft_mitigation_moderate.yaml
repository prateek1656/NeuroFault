# FeFET device technology, soft_mitigation-only arm, moderate fault regime -
# see device_fefet_no_mitigation_moderate.yaml for the recalibration
# rationale (injection_interval=420 = 1260 total batches / 3, matching this
# arm's 20-epoch length, for the same ~27% final stuck fraction target).
name: device_fefet_soft_mitigation_moderate
simulator: crosssim
epochs: 20
num_batches: 128
batch_size: 32
train_samples: 2000
test_samples: 1000
eval_interval: 3
device:
  name: fefet
  r_on: 100.0
  r_off: 4500.0
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
fault:
  density: 0.1
  distribution: random
  injection_interval: 420
mitigation:
  enable_soft_mitigation: true
  enable_remapping: false
  enable_layer_reset: false
  enable_predictive: false
  health_threshold: 75.0
