# SPARES 5% VARIANT of resnet9_calib_s4a_b_matched.yaml (only name and crossbar.redundancy_factor differ): at 15% spares the realistic stuck rates may be fully absorbed.
# HARDWARE-CALIBRATED FAULTS, S4a mid-life, total stuck 2.0%: 5 Weibull-timed waves (k=2 assumed), cumulative stuck 0.0200, random spatial pattern,
# plus secondary drift (all cells, 0.007 g_range toward HRS per wave; Nat Commun 2021 0.7%/month).
# HRS:LRS mix of new stuck cells = 9.04:1.75 (second-hand, Chen 2015 via three papers), set with fault.stuck_lrs_fraction = 1.75/10.79 = 0.1622.
# Derived from resnet9_real_s1_b_matched.yaml; only the header, name and fault block differ.
# Arm b_matched; derived from resnet9_deploy_b_matched.yaml (only the fault block, burst rate and priors path differ).
# Deployment regime, arm B compute-matched control: periodic like B, but burst_batches must be set to D's MEASURED
# mean burst length after Stage 1 (390 below is a PLACEHOLDER equal to B's), so B and D spend equal compute.
# Same lifetime, fault maps and evals as resnet9_deploy_r0.yaml (only the policy fields differ).
# pre_deploy_checkpoint below is a PLACEHOLDER (use --pre-deploy-checkpoint per seed).
# burst_lr / burst_batches are PLACEHOLDERS: set from the calibration sweep
# (scripts/calibrate_retrain_controller.py, plan "Calibration"); one shared value for every burst arm.
name: resnet9_calib_s4a5_b_matched
simulator: crosssim
regime: deployment
pre_deploy_checkpoint: results/resnet9_predeploy/pre_deploy.pt
# Model/data settings must match the predeploy config so the loaded weights and the
# canary/test splits mean the same thing.
epochs: 14
float_pretrain_epochs: 10
num_batches: 390
batch_size: 128
train_samples: 50000
test_samples: 5000
learning_rate: 0.05
optimizer: sgd
momentum: 0.9
label_smoothing: 0.1
grad_clip_norm: 1.0
weight_decay: 0.0001
eval_interval: 100
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
  redundancy_factor: 0.05
  use_gpu: true
  calibrate_adc: true
  adc_calibration_images: 320
  calibrate_dac: true
fault:
  density: 0.1
  distribution: random
  injection_interval: 5200
  wave_densities: [0.00081, 0.00242, 0.00403, 0.00564, 0.00725]
  stuck_lrs_fraction: 0.1622
secondary_fault:
  failure_model: drift
  density: 1.0
  distribution: random
  injection_interval: 5200
  drift_magnitude: 0.007
  drift_direction: toward_hrs
mitigation:
  enable_soft_mitigation: false
  enable_remapping: false
  enable_layer_reset: false
  enable_predictive: false
retraining:
  policy: periodic
  canary_size: 1024
  reference_mode: frozen
  remap_order: prefix
  burst_lr: 0.5   # tuned (B 0.5, C-prime 0.5)
  burst_batches: 390   # PLACEHOLDER: script sets D total / n bursts
