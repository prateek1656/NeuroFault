# Same arm as layer_reset_only.yaml, with injection_interval recalibrated to
# a non-saturating fault regime - see no_mitigation_moderate.yaml's comment
# for the full rationale. Now that layer_reset actually fires (a real bug fixed during development), this is also the first config where it's ever been
# run for real end to end, not just "unverified until the Phase 1 smoke test
# actually exercises it" per this file's original note above.
#
# injection_interval recalibrated to 420 (1260 total batches / 3) for the
# same ~3-injection-cycle, ~27% final stuck fraction target as the other
# moderate-regime arms. density/distribution/epoch counts unchanged.
name: layer_reset_only_moderate
simulator: crosssim
epochs: 20
num_batches: 128
batch_size: 32
train_samples: 2000
test_samples: 1000
eval_interval: 3
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
fault:
  density: 0.1
  distribution: random
  injection_interval: 420
mitigation:
  enable_soft_mitigation: false
  enable_remapping: false
  enable_layer_reset: true
  enable_predictive: false
  health_threshold: 75.0
