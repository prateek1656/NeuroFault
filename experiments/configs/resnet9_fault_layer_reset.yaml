# Arm 4/6 of the ResNet-9 fault-tolerance comparison - see resnet9_fault_no_mitigation.yaml
# for the shared fault-schedule derivation (density=0.1, injection_interval=5200, ~3 cycles,
# ~27% final stuck fraction).
#
# Dispatch-eligibility note (opposite of remapping's): layer_reset only fires while
# avg_health <= mitigation.health_threshold (75 default) - the complementary health band to
# remapping's. Confirmed via the same isolated-probe method used for the other arms: once
# targeted (positions=stuck_mask-filtered cells, fix), a single
# apply_layer_reset call's own cost is cheap even on the largest 2.36M-cell crossbars
# (~0.09-0.10s each at ~27% stuck / ~640K targeted positions, ~0.26s total across all 9
# crossbars for one firing) - the real per-check_health() cost driver is the
# get_critical_devices()/position-filtering overhead fixed in the same development pass (see
# HealthMonitor.filter_positions_by_mask's docstring), not apply_layer_reset itself.
# layer_reset_cooldown_checks uses the field's own default (10 checks = 100 batches per
# layer) - not yet re-tuned for this schedule; if it fires far more or less often than
# useful at this real cadence, that's a legitimate follow-up, not assumed correct here.
name: resnet9_fault_layer_reset
simulator: crosssim
epochs: 50
float_pretrain_epochs: 10
finetune_learning_rate: 0.001
num_batches: 390
batch_size: 128
train_samples: 50000
test_samples: 5000
learning_rate: 0.05
optimizer: sgd
momentum: 0.9
lr_one_cycle: true
label_smoothing: 0.1
grad_clip_norm: 1.0
weight_decay: 0.0001
eval_interval: 100
save_checkpoint: true  # real, reported-number run
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
  use_gpu: true
  calibrate_adc: true
  adc_calibration_images: 320
  calibrate_dac: true
fault:
  density: 0.1
  distribution: random
  injection_interval: 5200
mitigation:
  enable_soft_mitigation: false
  enable_remapping: false
  enable_layer_reset: true
  enable_predictive: false
