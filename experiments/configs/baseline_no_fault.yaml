# True no-fault ceiling. Currently missing as an explicit arm in the
# original main.py's 4 configs - added here to establish the accuracy
# baseline against which every mitigation strategy's recovery is measured.
name: baseline_no_fault
simulator: crosssim
epochs: 15
num_batches: 128
batch_size: 32
train_samples: 2000
test_samples: 1000
eval_interval: 3
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
fault:
  density: 0.0
mitigation:
  enable_soft_mitigation: false
  enable_remapping: false
  enable_layer_reset: false
  enable_predictive: false
