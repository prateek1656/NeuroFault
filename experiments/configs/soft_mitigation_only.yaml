# Mirrors Implementation.ipynb's real, actually-executed run 2 (epochs=20).
# Fixed vs. the original codebase: soft mitigation is now reachable directly
# from the runtime-fault path (bug #4), not only via a predictive path whose
# history never accumulated in practice.
name: soft_mitigation_only
simulator: crosssim
epochs: 20
num_batches: 128
batch_size: 32
train_samples: 2000
test_samples: 1000
eval_interval: 3
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
fault:
  density: 0.1
  distribution: random
  injection_interval: 8
mitigation:
  enable_soft_mitigation: true
  enable_remapping: false
  enable_layer_reset: false
  enable_predictive: false
  health_threshold: 75.0
