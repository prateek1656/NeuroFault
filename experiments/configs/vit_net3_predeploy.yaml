# NET3 (third network, tiny ViT, model_arch vit_tiny): clean pre-deploy net (10 float + 4 analog epochs).
# RECIPE (ViT needs a different one than the CNNs; chosen, NOT measured before the GPU run):
#   AdamW, peak lr 1e-3 with one-cycle (30% warm-up then cosine-style decay), weight decay 0.05, label smoothing 0.1,
#   grad clip 1.0, same crop/flip/cutout augmentation. SGD at lr 0.05 is known to train ViTs badly from scratch.
#   Analog phase: finetune peak lr 2e-4 (a fresh 1e-3 peak would undo the float phase).
# Deploy arms keep optimizer: sgd (bursts use SGD at burst_lr, same as the other nets). The optimizer is not part of the deployed state.
# Fault-aware retraining rebuild: train the CLEAN pre-fault checkpoint that every
# deployment-regime arm starts from. Same training recipe as the continuous-regime
# resnet9_fault_*_no_mitigation arms (10 float + 4 analog epochs; ~88.8% in the verified
# runs), but with NO fault injection (save_pre_deploy_checkpoint) and a diagonal-Fisher
# tracker accumulating through the analog phase. Writes
# results/<name>/pre_deploy.pt = {model_state_dict, fisher_state, config_hash, final_test_acc}
# and stops. Run once per seed (--seed N renames the output dir to <name>_seedN).
# Deployment configs point pre_deploy_checkpoint at that file.
name: vit_net3_predeploy
simulator: crosssim
model_arch: vit_tiny
regime: deployment
save_pre_deploy_checkpoint: true
epochs: 14
float_pretrain_epochs: 10
finetune_learning_rate: 0.0002
num_batches: 390
batch_size: 128
train_samples: 50000
test_samples: 5000
learning_rate: 0.001
optimizer: adamw
lr_one_cycle: true
label_smoothing: 0.1
grad_clip_norm: 1.0
weight_decay: 0.05
eval_interval: 100
save_checkpoint: true  # also keep the plain analog state_dict, like the continuous arms
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
  use_gpu: true
  calibrate_adc: true
  adc_calibration_images: 320
  calibrate_dac: true
fault:
  density: 0.1  # unused here (nothing is injected); kept equal to the deployment arms
  distribution: random
  injection_interval: 5200
mitigation:
  enable_soft_mitigation: false
  enable_remapping: false
  enable_layer_reset: false
  enable_predictive: false
