# The real "get accuracy sorted" run:
# faithfully replicates IBM's own published ResNet-9/CIFAR-10 training recipe (Le Gallo et al.
# 2023, Nature Electronics - verified against the arXiv preprint's Methods section, not guessed:
# SGD momentum=0.9, initial/peak LR=0.05, batch_size=128, RandomCrop+Cutout(4x4) - all matched
# exactly) on the current ResNet-9 architecture (src/neurofault/models/cnn.py, replacing the
# prior 3-residual-block model that plateaued at 49.5%/56.24% on the real full-scale run -
# IBM's ResNet-9 has FEWER params (1.87M) than that prior architecture (~3.04M) yet
# reaches 93.67% digital, so capacity was never the bottleneck; the recipe was).
#
# Epochs deliberately NOT set to IBM's raw 300: IBM's 300 epochs used plain cosine annealing.
# This config uses one-cycle LR (lr_one_cycle: true) instead - the actual technique
# ("superconvergence", Smith 2018) that the canonical ResNet-9/DAWNBench lineage uses specifically
# to reach comparable-or-better accuracy in far fewer epochs than a slow cosine schedule (the
# published DAWNBench ResNet-9 entries hit ~94% in as few as 10-24 epochs). 50 epochs here is a
# reasoned, bounded starting point given that context, not a guess and not a copy of IBM's number -
# time it for real (1-epoch probe) before committing to the full run, same discipline as every
# other GPU decision during development.
name: resnet9_ibm_recipe_full_scale_gpu
simulator: crosssim
epochs: 50
num_batches: 390
batch_size: 128
train_samples: 50000
test_samples: 5000
learning_rate: 0.05
optimizer: sgd
momentum: 0.9
lr_one_cycle: true
label_smoothing: 0.1
grad_clip_norm: 1.0  # real failure hit without this: loss went nan at epoch 2/50, batch ~1100
#   (clean and healthy the batch before) - classic SGD-divergence pattern, see config.py's
#   grad_clip_norm docstring for the full incident.
weight_decay: 0.0001
eval_interval: 100
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
  use_gpu: true
fault:
  density: 0.0
mitigation:
  enable_soft_mitigation: false
  enable_remapping: false
  enable_layer_reset: false
  enable_predictive: false
