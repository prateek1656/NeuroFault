# Reinstated from the notebook's disabled/never-run "hard reset only" arm.
# UNVERIFIED until the Phase 1 smoke test actually exercises it - flagged
# explicitly rather than presented
# as an established result.
name: layer_reset_only
simulator: crosssim
epochs: 20
num_batches: 128
batch_size: 32
train_samples: 2000
test_samples: 1000
eval_interval: 3
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
fault:
  density: 0.1
  distribution: random
  injection_interval: 8
mitigation:
  enable_soft_mitigation: false
  enable_remapping: false
  enable_layer_reset: true
  enable_predictive: false
  health_threshold: 75.0
