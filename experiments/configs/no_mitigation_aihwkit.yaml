# Same arm as no_mitigation.yaml but on the AIHWKit backend (via
# TorchInferenceRPUConfig - see crossbar/backends/aihwkit_backend.py's module
# docstring), which genuinely routes the forward pass through the programmed
# crossbar tile, so fault density here actually degrades reported accuracy.
# Uses a real IBM PCM device preset rather than the default IdealDevice.
name: no_mitigation_aihwkit
simulator: aihwkit
device:
  name: pcm
epochs: 15
num_batches: 128
batch_size: 32
train_samples: 2000
test_samples: 1000
eval_interval: 3
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
fault:
  density: 0.1
  distribution: random
  injection_interval: 8
mitigation:
  enable_soft_mitigation: false
  enable_remapping: false
  enable_layer_reset: false
  enable_predictive: false
