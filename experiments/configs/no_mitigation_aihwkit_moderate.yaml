# Same arm as no_mitigation_aihwkit.yaml (AIHWKit backend, PCM device),
# with injection_interval recalibrated to the non-saturating moderate
# fault regime - see no_mitigation_moderate.yaml's comment for the full
# rationale. AIHWKit's own synchronize() is a documented no-op (see
# crosssim_backend.py/aihwkit_backend.py's synchronize() docstrings), so the
# mitigation-clobber bug (Bug A) didn't apply to this backend specifically -
# but the general _reapply_pins() fix runs unconditionally regardless of
# backend, so this is included for consistency and to establish whether the
# moderate regime and the fixed pipeline generalize to a different backend.
name: no_mitigation_aihwkit_moderate
simulator: aihwkit
device:
  name: pcm
epochs: 15
num_batches: 128
batch_size: 32
train_samples: 2000
test_samples: 1000
eval_interval: 3
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
fault:
  density: 0.1
  distribution: random
  injection_interval: 315
mitigation:
  enable_soft_mitigation: false
  enable_remapping: false
  enable_layer_reset: false
  enable_predictive: false
