# Arm 3/6 of the ResNet-9 fault-tolerance comparison - see resnet9_fault_no_mitigation.yaml
# for the shared fault-schedule derivation (density=0.1, injection_interval=5200, ~3 cycles,
# ~27% final stuck fraction). redundancy_factor uses the crossbar config's own default
# (0.15, i.e. 15% per-crossbar spare capacity) - same value the old moderate-regime remap
# arms set explicitly, now just the field's own default.
#
# Real dispatch-timing mechanism, CONFIRMED via a fast isolated probe (drives check_health/ inject_faults directly at this config's real batch cadence, skipping actual forward/ backward):
# remap only fires while avg_health > mitigation.health_threshold (75 default), and at
# this schedule that window is real but SHORT and EARLY - avg_health starts ~99, drops
# below 75 by ~batch 5500 (right after the first injection event at 5200), and never
# recovers. Result: remap fires in one single burst right after injection cycle 1 (656,859
# cells, ~66.7% of total redundancy capacity across all 9 crossbars, matching that cycle's
# ~10% stuck fraction almost exactly), then NEVER fires again for injection cycles 2 or 3 -
# not because capacity ran out, but because avg_health has already permanently fallen
# below the eligibility threshold by then. This is a stronger, more specific version of the
# already-known "remapping is a statistical wash once capacity saturates" finding: here it's gated out by health-threshold timing before capacity is even the binding
# constraint for cycles 2-3. Confirmed real, not yet re-verified via an actual GPU training
# run (that probe skips real forward/backward/loss) - the Tier 3 GPU smoke test should
# still confirm this holds once real training dynamics (which also perturb health via
# ordinary write-endurance wear, absent from this probe) are in the loop.
name: resnet9_fault_remapping
simulator: crosssim
epochs: 50
float_pretrain_epochs: 10
finetune_learning_rate: 0.001
num_batches: 390
batch_size: 128
train_samples: 50000
test_samples: 5000
learning_rate: 0.05
optimizer: sgd
momentum: 0.9
lr_one_cycle: true
label_smoothing: 0.1
grad_clip_norm: 1.0
weight_decay: 0.0001
eval_interval: 100
save_checkpoint: true  # real, reported-number run
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
  use_gpu: true
  calibrate_adc: true
  adc_calibration_images: 320
  calibrate_dac: true
fault:
  density: 0.1
  distribution: random
  injection_interval: 5200
mitigation:
  enable_soft_mitigation: false
  enable_remapping: true
  enable_layer_reset: false
  enable_predictive: false
