# Mirrors Implementation.ipynb's run 3, which was manually killed mid-run
# because the original HealthMonitor's per-cell Python loop was too slow.
# Now safe to actually run end-to-end thanks to the vectorized rewrite in
# crossbar/health_monitor.py (bug #7).
name: remapping_only
simulator: crosssim
epochs: 20
num_batches: 128
batch_size: 32
train_samples: 2000
test_samples: 1000
eval_interval: 3
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_factor: 0.15
  redundancy_scheme: idealized_per_cell
fault:
  density: 0.1
  distribution: random
  injection_interval: 8
mitigation:
  enable_soft_mitigation: false
  enable_remapping: true
  enable_layer_reset: false
  enable_predictive: false
  health_threshold: 75.0
