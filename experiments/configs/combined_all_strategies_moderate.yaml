# Same arm as combined_all_strategies.yaml, with injection_interval
# recalibrated to a non-saturating fault regime - see
# no_mitigation_moderate.yaml's comment for the full rationale.
#
# injection_interval recalibrated to 210 (630 total batches / 3) for the
# same ~3-injection-cycle, ~27% final stuck fraction target as the other
# moderate-regime arms. density/distribution/epoch counts unchanged.
name: combined_all_strategies_moderate
simulator: crosssim
epochs: 10
num_batches: 128
batch_size: 32
train_samples: 2000
test_samples: 1000
eval_interval: 3
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_factor: 0.15
  redundancy_scheme: idealized_per_cell
fault:
  density: 0.1
  distribution: random
  injection_interval: 210
mitigation:
  enable_soft_mitigation: true
  enable_remapping: true
  enable_layer_reset: true
  enable_predictive: true
  health_threshold: 75.0
