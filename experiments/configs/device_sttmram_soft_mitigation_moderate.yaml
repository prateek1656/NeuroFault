# STT-MRAM device technology, soft_mitigation-only arm, moderate fault
# regime - see device_sttmram_no_mitigation_moderate.yaml for the
# recalibration rationale (injection_interval=420, matching this arm's
# 20-epoch length).
name: device_sttmram_soft_mitigation_moderate
simulator: crosssim
epochs: 20
num_batches: 128
batch_size: 32
train_samples: 2000
test_samples: 1000
eval_interval: 3
device:
  name: sttmram
  r_on: 100.0
  r_off: 10000.0
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
fault:
  density: 0.1
  distribution: random
  injection_interval: 420
mitigation:
  enable_soft_mitigation: true
  enable_remapping: false
  enable_layer_reset: false
  enable_predictive: false
  health_threshold: 75.0
