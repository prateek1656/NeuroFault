# Arm 5/6 of the ResNet-9 fault-tolerance comparison - see resnet9_fault_no_mitigation.yaml
# for the shared fault-schedule derivation (density=0.1, injection_interval=5200, ~3 cycles,
# ~27% final stuck fraction). All three density-model-relevant strategies enabled together
# (remapping + layer_reset; soft_mitigation is also on for completeness/parity with the old
# project's combined_all_strategies.yaml, but is expected to be a no-op here for the same
# reason as resnet9_fault_soft_mitigation.yaml - see that config's header).
#
# Real, confirmed dispatch interaction: remapping and layer_reset are mutually exclusive by
# health band (dispatch.py: remap only in avg_health>75, layer_reset only in avg_health<=75),
# so they never compete for the same critical devices within one check_health() call - one
# fires early (remap, once, per resnet9_fault_remapping.yaml's confirmed trajectory), the
# other takes over once health has permanently dropped past 75.
name: resnet9_fault_combined
simulator: crosssim
epochs: 50
float_pretrain_epochs: 10
finetune_learning_rate: 0.001
num_batches: 390
batch_size: 128
train_samples: 50000
test_samples: 5000
learning_rate: 0.05
optimizer: sgd
momentum: 0.9
lr_one_cycle: true
label_smoothing: 0.1
grad_clip_norm: 1.0
weight_decay: 0.0001
eval_interval: 100
save_checkpoint: true  # real, reported-number run
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
  use_gpu: true
  calibrate_adc: true
  adc_calibration_images: 320
  calibrate_dac: true
fault:
  density: 0.1
  distribution: random
  injection_interval: 5200
mitigation:
  enable_soft_mitigation: true
  enable_remapping: true
  enable_layer_reset: true
  enable_predictive: false
