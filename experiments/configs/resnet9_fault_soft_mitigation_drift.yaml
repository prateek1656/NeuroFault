# Arm 6/6 of the ResNet-9 fault-tolerance comparison, and the important different one:
# failure_model="drift" instead of the other 5 arms' "density" (stuck-at). Added
# specifically because soft_mitigation is a PROVEN NO-OP against stuck-at faults (see
# resnet9_fault_soft_mitigation.yaml's header) - it only ever acts on monitor.drift_mask,
# which only this failure model ever sets. This is the first config in this project's
# history to actually exercise that mechanism.
#
# density/drift_magnitude/drift_direction use FaultConfig's own defaults (0.1 / 0.05 /
# "toward_hrs" - see config.py's docstring for the literature-grounded caveat on
# drift_direction's default). injection_interval reuses the same 5200 derived for the
# other 5 arms: _drift's cell-selection code is identical to _custom_stuck_at's (same
# `_select_fault_indices` call, same memoryless per-call redraw - see injection.py) so the
# same 1-(1-density)^k formula applies to "fraction of cells that have drifted at least
# once," giving the same ~27%-by-end-of-run target. NOT yet empirically re-confirmed at
# this specific schedule/scale the way the stuck-at formula was (that confirmation used
# failure_model="density"); only confirmed so far at a small, fast, aggressive-interval CPU
# smoke scale (tests/invariants/test_fault_injection_full_network.py::
# test_soft_mitigation_fires_under_drift_faults), where it produced real, nonzero
# soft_mitigations. Worth a real GPU-side check (or a cheap local one, following Tier 2's
# own verify-before-trusting standard for the other arms) before treating this arm's
# numbers as calibrated with the same confidence as the other 5.
name: resnet9_fault_soft_mitigation_drift
simulator: crosssim
epochs: 50
float_pretrain_epochs: 10
finetune_learning_rate: 0.001
num_batches: 390
batch_size: 128
train_samples: 50000
test_samples: 5000
learning_rate: 0.05
optimizer: sgd
momentum: 0.9
lr_one_cycle: true
label_smoothing: 0.1
grad_clip_norm: 1.0
weight_decay: 0.0001
eval_interval: 100
save_checkpoint: true  # real, reported-number run
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
  use_gpu: true
  calibrate_adc: true
  adc_calibration_images: 320
  calibrate_dac: true
fault:
  density: 0.1
  distribution: random
  injection_interval: 5200
  failure_model: drift
mitigation:
  enable_soft_mitigation: true
  enable_remapping: false
  enable_layer_reset: false
  enable_predictive: false
