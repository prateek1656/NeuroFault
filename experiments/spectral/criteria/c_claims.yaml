schema_version: 1
id: c_claims
title: "Direction C' (analog loop) pre-registered S/K criteria, cross-cutting kills, decision points D1/D2"
source_plan: "plan-C-analog-loop §2, §5, §8"
frozen: "2026-10-08"
overall_pass: any
note: >
  Overall = PASS if ANY support claim holds; the disposition rules of plan-C §8 ("one survives:
  scope the claim to that arm") mean by_scope is the real output. Fixtures: 3 checkpoints x 5
  fault/noise seeds, N in {64,128,256}; cells are (layer, tile, seed). Reported with median and
  bootstrap 95% CI; no re-running with different seeds after seeing results (plan-C §5.1).
criteria:
  - id: C-X0
    source: "plan-C §5.2 C-X0; master plan P2.7"
    kind: pass
    scope: reproduction_gate
    description: "Re-implement the §4.1 table via F0's simulator and confirm within 10% of the scratch numbers. Gate: if not, update §5 before any other run."
    clauses:
      - {metric: rel_dev_vs_scratch, aggregation: max, comparator: "<=", threshold: 0.10}
  - id: S1
    source: "plan-C §5.2 C-X1 Support S1"
    kind: pass
    scope: C1
    description: >
      Exists a (beta, f, amplitude-mode) setting with warm t_loc90 <= 1.0 * t_MVM(8b) AND localization
      >= 90% at output noise matched to B1's 90%-accuracy noise level, in >= 75% of (layer, tile, seed)
      cells, with purity >= 0.98 and no latch.
    note: "Script emits per-cell bool s1_cell_ok (all conditions); setting = (beta, f, amp_mode). Pass when the best setting has >= 75% ok cells."
    clauses:
      - metric: s1_cell_ok
        per_group: {by: [beta, f, amp_mode], aggregation: mean}
        aggregation: max
        comparator: ">="
        threshold: 0.75
  - id: K1a
    source: "plan-C §5.2 C-X1 Kill K1a; plan-C §2 C1 Kill K1"
    kind: kill
    scope: C1
    description: "For every setting, t_loc90 > 3 * t_MVM(8b) in >= 50% of cells."
    clauses:
      - metric: t_loc90_gt_3x_mvm8
        per_group: {by: [beta, f, amp_mode], aggregation: mean}
        aggregation: min
        comparator: ">="
        threshold: 0.50
  - id: K1b
    source: "plan-C §5.2 C-X1 Kill K1b"
    kind: kill
    scope: C1
    description: "SNR(loop at the setting achieving S1 timing) < SNR(B1)/3 so that matching B1's localization accuracy needs >= 3 repeated settles (latency parity lost)."
    clauses:
      - {metric: snr_loop_over_snr_b1, aggregation: median, filter: {s1_timing_setting: true}, comparator: "<", threshold: 0.3333333333333333}
  - id: K1c
    source: "plan-C §5.2 C-X1 Kill K1c"
    kind: kill
    scope: C1
    description: "The only fast settings require unrealistic G_l precision < 0.1% of sigma_1 or reference-servo bandwidth > 0.3*GBW."
    combine: any
    note: "Evaluated over the settings that meet S1 timing (s1_timing_setting == true)."
    clauses:
      - {metric: required_gl_precision_frac, aggregation: max, filter: {s1_timing_setting: true}, comparator: "<", threshold: 0.001}
      - {metric: servo_bw_over_gbw, aggregation: min, filter: {s1_timing_setting: true}, comparator: ">", threshold: 0.3}
  - id: S2
    source: "plan-C §5.2 C-X2 Support S2"
    kind: pass
    scope: C1
    description: >
      L1 achieves >= 90% single-fault row localization at 2% cell noise with EDAP <= 0.5 * EDAP(best of
      B1, B3, B4) in >= 60% of cells and at least one parameter point of the literature ranges (§3.1)
      keeps this true.
    note: "Script emits per-cell bool s2_cell_ok and the count of literature-range parameter points where S2 holds."
    clauses:
      - {metric: s2_cell_ok, aggregation: mean, comparator: ">=", threshold: 0.60}
      - {metric: n_literature_points_s2_ok, aggregation: max, comparator: ">=", threshold: 1}
  - id: K2
    source: "plan-C §5.2 C-X2 Kill K2; plan-C §2 C1 Kill K2"
    kind: kill
    scope: C1
    description: "EDAP(L1) > EDAP(B3) at every point of the literature ranges (expected), or L1 localization < B1 localization at equal time in >= 80% of cells."
    combine: any
    clauses:
      - {metric: edap_l1_over_b3, aggregation: min, comparator: ">", threshold: 1.0}
      - {metric: l1_loc_below_b1_at_equal_time, aggregation: mean, comparator: ">=", threshold: 0.80}
  - id: S3
    source: "plan-C §5.2 C-X3 Support S3"
    kind: pass
    scope: C2
    description: >
      Loop on E localizes single stuck faults (>= 90% row AND column) at amplitude / noise settings where
      K=64 probes need >= 2x the energy*latency of the loop, and EDAP(L2) <= EDAP(64 probes) at the same
      area (reference array counted at 100% unless sharing across >= 8 tiles is justified by a measured/
      literature drift-correlation number from A's fixtures).
    note: "Exists-a-setting: at least one row meeting all conditions together."
    clauses:
      - metric: row_loc
        aggregation: count
        filter: {query: "row_loc >= 0.9 and col_loc >= 0.9 and probe64_over_loop_energy_latency >= 2 and edap_l2_over_probe64 <= 1"}
        comparator: ">="
        threshold: 1
  - id: K3
    source: "plan-C §5.2 C-X3 Kill K3; plan-C §2 C2 Kill K3"
    kind: kill
    scope: C2
    description: >
      Independent-drift floor above fault amplitude at f_ind >= 10% (realistic for PCM per-device nu
      variation 22%), or parity K_p <= 8 localizes at lower EDAP, or EDAP(L2) > EDAP(64 probes).
      Expected outcome: parity wins (B3 ~3% area).
    combine: any
    clauses:
      - {metric: floor_over_fault_amplitude, aggregation: min, filter: {f_ind: {">=": 0.10}}, comparator: ">", threshold: 1.0}
      - {metric: parity_edap_over_l2, aggregation: median, filter: {parity_Kp: {"<=": 8}}, comparator: "<", threshold: 1.0}
      - {metric: edap_l2_over_probe64, aggregation: median, comparator: ">", threshold: 1.0}
  - id: S4
    source: "plan-C §5.2 C-X4 Support S4"
    kind: pass
    scope: C3
    description: "Loop watchdog AUC >= GDC-read AUC at structured non-uniform drift (A's fixtures) AND cost (energy*latency) <= 0.5x."
    clauses:
      - {metric: loop_minus_gdc_auc, aggregation: median, comparator: ">=", threshold: 0.0}
      - {metric: loop_over_gdc_energy_latency, aggregation: median, comparator: "<=", threshold: 0.5}
  - id: K4
    source: "plan-C §5.2 C-X4 Kill K4; plan-C §2 C3 Kill K4"
    kind: kill
    scope: C3
    description: >
      A's signal experiment fails (sigma_1 or slope not better than GDC scalar / per-column on structured
      non-uniform drift at equal reads), or reference-conductance precision required is worse than any
      available reference, or t_loop >= t_MVM(calibration read). Run only after A reports.
    note: >
      The reference-precision sub-condition has no numeric threshold in the plan and is NOT encoded
      (needs human judgement). a_signal_beats_gdc comes from A's results (0/1).
    combine: any
    clauses:
      - {metric: a_signal_beats_gdc, aggregation: max, comparator: "==", threshold: 0}
      - {metric: t_loop_over_t_mvm_cal, aggregation: median, comparator: ">=", threshold: 1.0}
  - id: D1
    source: "plan-C §8 Decision point D1"
    kind: kill
    scope: C1_C3_park
    description: >
      PARK C1 (pilot loop) and C3 if any of: K1a/K1b/K1c triggered; or K2 triggered; or the AGC/servo
      bandwidth required for a latch-free linear regime pushes warm latency above 3x t_MVM.
    combine: any
    clauses:
      - {ref: K1a}
      - {ref: K1b}
      - {ref: K1c}
      - {ref: K2}
      - {metric: warm_latency_over_t_mvm_latch_free, aggregation: min, comparator: ">", threshold: 3.0}
  - id: D2
    source: "plan-C §8 Decision point D2"
    kind: kill
    scope: C2_park
    description: "PARK C2 if K3 triggers (floor above fault amplitude at f_ind >= 10%, or parity/EDAP beats it). Expected outcome: park (~75%)."
    clauses:
      - {ref: K3}
  - id: C2-continue-prestudy
    source: "plan-C §8 Decision point D1 (second paragraph)"
    kind: report
    scope: C2
    description: >
      Continue C2 independently of C1 only if S2 is not triggered as a kill AND the C-X3 pre-study (1 day)
      shows the independent-drift floor is below a realistic stuck amplitude at f_ind = 10%; otherwise
      skip C-X3 and park everything.
    note: "Only the pre-study half is encoded (floor/amplitude < 1 at f_ind = 0.10); the 'S2 not a kill' half is read from K2."
    clauses:
      - {metric: floor_over_fault_amplitude, aggregation: max, filter: {f_ind: 0.10}, comparator: "<", threshold: 1.0}
  - id: KX1
    source: "plan-C §2 cross-cutting KX1 (research-04)"
    kind: kill
    scope: C1_C3_park
    description: "Behavioral ODE with finite GBW shows loop is not faster/cheaper than one MVM + comparator => C1, C3 die."
    note: "AMBIGUOUS 'faster/cheaper': read as BOTH latency and energy ratios (loop/MVM+comparator) >= 1."
    clauses:
      - {metric: t_loop_over_t_mvm_cmp, aggregation: min, comparator: ">=", threshold: 1.0}
      - {metric: energy_loop_over_mvm_cmp, aggregation: min, comparator: ">=", threshold: 1.0}
  - id: KX3
    source: "plan-C §2 cross-cutting KX3 (research-01)"
    kind: kill
    scope: C1_C3_park
    description: "If EDAP(loop) > EDAP(best baseline) for every parameter setting inside the pre-registered literature ranges (§3.4), direction dies."
    clauses:
      - {metric: edap_loop_over_best_baseline, aggregation: min, comparator: ">", threshold: 1.0}
