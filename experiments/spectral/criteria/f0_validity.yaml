schema_version: 1
id: f0_validity
title: "F0.0 validity gates (and F0.8 bridge consistency) - nothing else is trusted until these pass"
source_plan: "plan-F0 §9 F0.0a-e, F0.8a-c; master plan P0.3, P4.1"
frozen: "2026-10-08"
overall_pass: all
note: >
  F0.8 (bridge consistency) has no file of its own in the build brief; it is transcribed here
  because, like F0.0, its failure blocks downstream conclusions ("blocks F0.3 network-level
  conclusions"). Metric names are the contract with the experiment script.
criteria:
  - id: F0.0a
    source: "plan-F0 §9 F0.0a"
    kind: pass
    description: >
      Probe reproduction in the original setting (signed_ideal, 256, first-slice, 2% per_cell
      fresh noise, seed 42, 200 trials): sigma_1 SNR median and probe SNR/row-loc within +-15%
      (relative) of the tabulated numbers in 00-grounding.md (0.05-0.09 / ~3.1 / 55-62%);
      sigma_1/sigma_2 within 0.01. Fail => stack wrong or old probe seed-lucky (either is a finding).
    note: >
      The reference is a RANGE for sigma_1 SNR (0.05-0.09) and row-loc (55-62%). Transcribed as
      "relative error to the nearest edge of the tabulated range / the point value" - the experiment
      script must emit rel_err = 0 inside the range and distance-to-range / range-edge outside it.
    clauses:
      - {metric: f00a_sigma1_snr_rel_err, aggregation: max, comparator: "<=", threshold: 0.15}
      - {metric: f00a_probe_snr_rel_err, aggregation: max, comparator: "<=", threshold: 0.15}
      - {metric: f00a_rowloc_rel_err, aggregation: max, comparator: "<=", threshold: 0.15}
      - {metric: f00a_gap_abs_err, aggregation: max, comparator: "<=", threshold: 0.01}
  - id: F0.0b
    source: "plan-F0 §9 F0.0b"
    kind: pass
    description: >
      D2 equivalence with AIHWKit: 1e5 devices at 6 target levels; distribution of G(t)/G0 and nu
      (two-sample KS, mean/std) vs PCMLikeNoiseModel (drift part and, separately, 1/f part).
      Pass: KS p > 0.01 at all levels/times and |mean ratio error| < 0.5%.
    clauses:
      - {metric: f00b_ks_p, aggregation: min, comparator: ">", threshold: 0.01}
      - {metric: f00b_mean_ratio_abs_err, aggregation: max, comparator: "<", threshold: 0.005}
  - id: F0.0c
    source: "plan-F0 §9 F0.0c"
    kind: pass
    description: >
      GDC parity: B1b vs AIHWKit GlobalDriftCompensation alpha on identical drifted tile: relative
      difference < read-noise-expected bound (and < 2% noise-free).
    note: >
      "read-noise-expected bound" is not a number in the plan. The script must emit
      f00c_rel_diff_over_noise_bound = rel_diff / bound (bound computed from the noise model before
      looking at the result); pass means ratio < 1.
    clauses:
      - {metric: f00c_rel_diff_over_noise_bound, aggregation: max, comparator: "<", threshold: 1.0}
      - {metric: f00c_rel_diff_noise_free, aggregation: max, comparator: "<", threshold: 0.02}
  - id: F0.0d
    source: "plan-F0 §9 F0.0d"
    kind: pass
    description: >
      D0 parity: LegacyRailShift vs injection._drift through tests/unit/fakes.make_handle:
      bit-identical matrices for a shared generator seed and drift_direction in
      {toward_hrs, toward_lrs}.
    clauses:
      - {metric: f00d_max_abs_diff, aggregation: max, comparator: "==", threshold: 0.0}
  - id: F0.0e
    source: "plan-F0 §9 F0.0e"
    kind: pass
    description: >
      Persistence/invariants: per-device nu constant across t; D1 + GDC residual < 1e-3 relative;
      G+/G- decode(encode(W)) == W to 1e-12; stuck devices never move.
    note: >
      "nu constant" and "stuck devices never move" are transcribed as max absolute deviation == 0
      (exact); the plan gives no tolerance for them.
    clauses:
      - {metric: f00e_nu_max_abs_change, aggregation: max, comparator: "==", threshold: 0.0}
      - {metric: f00e_d1_gdc_residual_rel, aggregation: max, comparator: "<", threshold: 0.001}
      - {metric: f00e_roundtrip_max_abs_err, aggregation: max, comparator: "<=", threshold: 1.0e-12}
      - {metric: f00e_stuck_max_abs_move, aggregation: max, comparator: "==", threshold: 0.0}
  - id: F0.8a
    source: "plan-F0 §9 F0.8(a)"
    kind: pass
    description: "Tier-1 vs tier-2 agreement <= 0.5 pt (seed 42, three time points)."
    clauses:
      - {metric: f08a_tier1_vs_tier2_abs_diff_pt, aggregation: max, comparator: "<=", threshold: 0.5}
  - id: F0.8b
    source: "plan-F0 §9 F0.8(b)"
    kind: pass
    description: >
      Our D2 + B1b vs AIHWKit-native D2 + GlobalDriftCompensation accuracy-vs-time: within 1.0 pt at
      each time point, 3 seeds. Remaining differences are reported, not hidden.
    clauses:
      - {metric: f08b_ours_vs_aihwkit_abs_diff_pt, aggregation: max, comparator: "<=", threshold: 1.0}
  - id: F0.8c
    source: "plan-F0 §9 F0.8(c)"
    kind: pass
    description: >
      No-drift tier-1 accuracy equals the checkpoint's stored final_test_acc within the test-set
      binomial CI.
    note: >
      Script emits f08c_abs_dev_over_binomial_halfwidth = |acc - stored| / CI half-width; pass <= 1.
    clauses:
      - {metric: f08c_abs_dev_over_binomial_halfwidth, aggregation: max, comparator: "<=", threshold: 1.0}
