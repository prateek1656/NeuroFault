schema_version: 1
id: f0_stuck_scaling
title: "F0.1 rigorous re-run of the sparse-fault feasibility probe (H1.1-H1.6)"
source_plan: "plan-F0 §9 F0.1"
frozen: "2026-10-08"
overall_pass: all
note: >
  Common protocol (plan-F0 §9): checkpoints {42,101,102}; 7 layers; tile sizes {64,128,256,512};
  conclusions stated per (layer type, tile size). One row per (layer, tile size, encoding, seed)
  cell unless a metric name says otherwise.
criteria:
  - id: H1.1
    source: "plan-F0 §9 F0.1 H1.1"
    kind: pass
    description: >
      Sparse blindness: sigma_1 detection AUC for k=1 at 2% per_cell noise is < 0.60 in >= 95% of
      (layer, tile-size, encoding, seed) cells. PASS = old verdict confirmed for all encodings.
    clauses:
      - metric: sigma1_auc
        aggregation: frac
        inner: {comparator: "<", threshold: 0.60}
        filter: {k: 1, noise_mode: per_cell, noise_sigma_frac: 0.02}
        comparator: ">="
        threshold: 0.95
  - id: H1.1-escalate
    source: "plan-F0 §9 F0.1 H1.1 (escalation clause)"
    kind: escalate
    description: >
      If AUC > 0.80 in any encoding for any tile size >= 128 => the old probe's signed/exact-SVD
      simplification was hiding a real signal: ESCALATE (report, re-plan C'/A-M1).
    note: "Evaluated at k=1, 2% per_cell noise (the H1.1 setting); the plan does not restate it."
    clauses:
      - metric: sigma1_auc
        aggregation: max
        filter: {k: 1, noise_mode: per_cell, noise_sigma_frac: 0.02, tile_size: {">=": 128}}
        comparator: ">"
        threshold: 0.80
  - id: H1.2
    source: "plan-F0 §9 F0.1 H1.2"
    kind: pass
    description: >
      Median relative shift of sigma_1 scales as tile_size^-1 (fit slope in [-1.15, -0.85]) and as
      k^0.5 for random-sign incoherent faults (slope in [0.35, 0.65]). Mismatch => theory needs revising.
    note: "Slopes are fitted by the script (log-log) and emitted one row per fit as h12_slope_tile / h12_slope_k."
    clauses:
      - {metric: h12_slope_tile, aggregation: median, comparator: between, threshold: [-1.15, -0.85]}
      - {metric: h12_slope_k, aggregation: median, comparator: between, threshold: [0.35, 0.65]}
  - id: H1.3-line
    source: "plan-F0 §9 F0.1 H1.3"
    kind: pass
    description: >
      A fully stuck row/column on T >= 128 tiles gives sigma_1 AUC > 0.9 at 2% noise (spectral
      detection of line faults is real).
    note: >
      AMBIGUOUS aggregation: "gives AUC > 0.9" is not stated per cell or pooled. Transcribed as the
      strictest reading (min over all T>=128 line-fault cells > 0.9). Revisit only via a logged change.
    clauses:
      - metric: sigma1_auc
        aggregation: min
        filter: {fault_kind: [line_row, line_col], noise_sigma_frac: 0.02, tile_size: {">=": 128}}
        comparator: ">"
        threshold: 0.9
  - id: H1.3-kill
    source: "plan-F0 §9 F0.1 H1.3"
    kind: kill
    scope: spectral_line_fault_claim
    description: >
      The line-fault claim survives only if it also beats the 1-row-checksum at equal MVM budget:
      checksum AUC >= spectral AUC at <= 1/10 cost => KILL the spectral line-fault claim (keep as footnote).
    note: >
      AMBIGUOUS aggregation (median over line-fault cells chosen). Script emits
      checksum_minus_spectral_auc (>= 0 means checksum at least as good) and checksum_to_spectral_cost_ratio.
    clauses:
      - {metric: checksum_minus_spectral_auc, aggregation: median, filter: {fault_kind: [line_row, line_col]}, comparator: ">=", threshold: 0.0}
      - {metric: checksum_to_spectral_cost_ratio, aggregation: median, filter: {fault_kind: [line_row, line_col]}, comparator: "<=", threshold: 0.1}
  - id: H1.4
    source: "plan-F0 §9 F0.1 H1.4"
    kind: pass
    description: >
      Encoding robustness: conclusions of H1.1 are identical across signed_ideal and diff_pair
      g_min in {0, 0.01, 0.05}.
    note: >
      Script emits h14_h11_conclusion_identical (1 if the H1.1 criterion has the same outcome in every
      encoding, else 0). The FaultTruth.delta_w distribution report is not a pass/fail item.
    clauses:
      - {metric: h14_h11_conclusion_identical, aggregation: min, comparator: "==", threshold: 1}
  - id: H1.5
    source: "plan-F0 §9 F0.1 H1.5"
    kind: report
    manual: true
    description: >
      Noise placement: report whether output_referred vs per_cell noise changes the best probe weight
      (dense vs sparse design); no pass/fail, input to B.
  - id: H1.6
    source: "plan-F0 §9 F0.1 H1.6"
    kind: pass
    description: >
      Probe baseline reproduces: single-probe row localization 45-70% in the old setting (the 55-62%
      figure); P=8 probes > 90% at k=1. Fail => decoder bug.
    clauses:
      - {metric: rowloc_p1, aggregation: median, filter: {setting: old_probe}, comparator: between, threshold: [0.45, 0.70]}
      - {metric: rowloc_p8, aggregation: median, filter: {setting: old_probe, k: 1}, comparator: ">", threshold: 0.90}
