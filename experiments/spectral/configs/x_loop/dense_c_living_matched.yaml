# X loop (closed loop, criteria/x_loop.yaml), DENSE regime = the mitigation paper's S1 Weibull scenario, unchanged
# except name/output_dir. Run through experiments/spectral/x_loop.py --locator {oracle,adaptive,readout}.
# REALISTIC-FAULT ROBUSTNESS, S1 Weibull wear-out: 5 equal waves, Weibull k=2, hazard-conditional densities, cumulative 27.1%, random spatial pattern.
# Arm c_living_matched; derived from resnet9_deploy_c_living.yaml (only the fault block, burst rate and priors path differ).
# Deployment regime, arm C' = C with reference_mode=living: spares take the cell's value-at-fault weight and train.
# Differs from C ONLY by reference_mode.
# Same lifetime, fault maps and evals as resnet9_deploy_r0.yaml (only the policy fields differ).
# pre_deploy_checkpoint below is a PLACEHOLDER (use --pre-deploy-checkpoint per seed).
# burst_lr / burst_batches are PLACEHOLDERS: set from the calibration sweep
# (scripts/calibrate_retrain_controller.py, plan "Calibration"); one shared value for every burst arm.
name: x_dense_c_living_matched
simulator: crosssim
regime: deployment
output_dir: results/spectral/x_loop
pre_deploy_checkpoint: results/resnet9_predeploy/pre_deploy.pt
# Model/data settings must match the predeploy config so the loaded weights and the
# canary/test splits mean the same thing.
epochs: 14
float_pretrain_epochs: 10
num_batches: 390
batch_size: 128
train_samples: 50000
test_samples: 5000
learning_rate: 0.05
optimizer: sgd
momentum: 0.9
label_smoothing: 0.1
grad_clip_norm: 1.0
weight_decay: 0.0001
eval_interval: 100
crossbar:
  patch_layer_types: [Linear, Conv2d]
  redundancy_scheme: idealized_per_cell
  redundancy_factor: 0.15
  use_gpu: true
  calibrate_adc: true
  adc_calibration_images: 320
  calibrate_dac: true
fault:
  density: 0.1
  distribution: random
  injection_interval: 5200
  wave_densities: [0.0126, 0.0372, 0.0613, 0.0847, 0.1076]
mitigation:
  enable_soft_mitigation: false
  enable_remapping: true
  enable_layer_reset: false
  enable_predictive: false
retraining:
  policy: capacity
  canary_size: 1024
  reference_mode: living
  remap_order: random
  burst_lr: 0.5   # tuned (B 0.5, C-prime 0.5)
  burst_batches: 390   # PLACEHOLDER: script sets D total / n bursts
